<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Valgames - Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<div class="">
    <div class="container">
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" th:href="@{/admin/products}">
                    <img th:src="@{/img/logo.png}" style="height: 30px;"/>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav container align-items-center">
                        <li class="nav-item dropdown text-center">
                            <a class="nav-link dropdown-toggle" href="#" role="button"
                               data-bs-toggle="dropdown">Products</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" th:href="@{/admin/products/new}">New Product</a></li>
                                <li><a class="dropdown-item" th:href="@{/admin/products/edit}">Edit Product</a></li>
                                <li><a class="dropdown-item" th:href="@{/admin/products/delete}">Delete Product</a></li>
                                <li><a class="dropdown-item" th:href="@{/admin/products}">List Products</a></li>
                            </ul>
                        </li>
                        <li class="nav-item cart-class ms-auto">
                            <form th:action="@{/logout}" method="post" style="display:inline;">
                                <button type="submit" class="nav-link d-flex align-items-center bg-opacity-50 rounded-4 btn btn-outline-dark">
                                    <div class="p-2">ADMIN</div>
                                    <div class="m-1 p-1 bg-dark bg-opacity-75 rounded-2 px-2 text-white">Logout</div>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4" style="max-width: 600px;">
            <h4 class="mb-4">Edit Product</h4>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <th:block th:if="${product == null}">
                <form th:action="@{/admin/products/edit}" method="get" class="d-flex gap-2 mb-4">
                    <input type="text" name="name" class="form-control"
                           placeholder="Search product by name..." th:value="${param.name}"/>
                    <button type="submit" class="btn btn-dark">Search</button>
                </form>
                <div th:if="${results != null}">
                    <p class="text-muted">Multiple products found. Select one:</p>
                    <ul class="list-group">
                        <a th:each="p : ${results}"
                           th:href="@{/admin/products/edit(id=${p.id})}"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                            <span th:text="${p.productName}"></span>
                            <span class="badge bg-secondary" th:text="'ID: ' + ${p.id}"></span>
                        </a>
                    </ul>
                </div>
            </th:block>

            <th:block th:if="${product != null}">
                <form th:action="@{/admin/products/edit}" method="post" th:object="${product}">
                    <input type="hidden" th:field="*{id}"/>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select th:field="*{categoryId}" class="form-select" required>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.categoryId}"
                                    th:text="${cat.categoryName}"
                                    th:selected="${cat.categoryId == product.categoryId}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" th:field="*{productName}" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{productDescription}" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Unit Price</label>
                        <input type="number" step="0.01" min="0.01" th:field="*{unitPrice}" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">SKU</label>
                        <input type="number" th:field="*{sku}" class="form-control" required/>
                    </div>
                    <button type="submit" class="btn btn-dark">Save Changes</button>
                    <a th:href="@{/admin/products/edit}" class="btn btn-secondary ms-2">Back</a>
                </form>
            </th:block>
        </div>
    </div>
</div>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
></script></body>
</html>
