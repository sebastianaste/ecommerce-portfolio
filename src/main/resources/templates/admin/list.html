<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Valgames - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<div class="">
    <div class="container">
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" th:href="@{/admin/products}">
                    <img th:src="@{/img/logo.png}" style="height: 30px;"/>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav container align-items-center">
                        <li class="nav-item dropdown text-center">
                            <a class="nav-link dropdown-toggle" href="#" role="button"
                               data-bs-toggle="dropdown">Products</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" th:href="@{/admin/products/new}">New Product</a></li>
                                <li><a class="dropdown-item" th:href="@{/admin/products/edit}">Edit Product</a></li>
                                <li><a class="dropdown-item" th:href="@{/admin/products/delete}">Delete Product</a></li>
                                <li><a class="dropdown-item" th:href="@{/admin/products}">List Products</a></li>
                            </ul>
                        </li>
                        <li class="nav-item cart-class ms-auto">
                            <form th:action="@{/logout}" method="post" style="display:inline;">
                                <button type="submit" class="nav-link d-flex align-items-center bg-opacity-50 rounded-4 btn btn-outline-dark">
                                    <div class="p-2">ADMIN</div>
                                    <div class="m-1 p-1 bg-dark bg-opacity-75 rounded-2 px-2 text-white">Logout</div>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:action="@{/admin/products}" method="get" class="d-flex justify-content-end mb-4">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" name="search" class="form-control"
                           placeholder="Search products..." th:value="${search}"/>
                    <button type="submit" class="btn btn-dark">Search</button>
                    <a th:href="@{/admin/products}" class="btn btn-dark">Clear</a>
                </div>
            </form>
        </div>

        <div class="container-fluid me-3 content-row">
            <div id="all" class="row">
                <div th:each="p : ${list}" class="col-sm-12 col-md-6 col-lg-4 col-xl-3 pt-3">
                    <div class="card">
                        <div class="img-card-product">
                            <p class="bg-warning bg-opacity-10 rounded-2 position-absolute top-0 end-0 m-2"
                               style="width: auto; padding: 8px 12px;" th:text="${p.unitPrice}"></p>
                            <img th:src="@{/img/{id}.png(id=${p.id})}" class="card-img-top"
                                 onerror="this.src='/img/placeholder.png'"/>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${p.productName}"></h5>
                            <p class="card-text description" th:text="${p.productDescription}"></p>
                            <div class="d-flex gap-2 mt-2">
                                <a th:href="@{/admin/products/edit(id=${p.id})}"
                                   class="btn btn-sm btn-outline-dark">Edit</a>
                                <a th:href="@{/admin/products/delete(id=${p.id})}"
                                   class="btn btn-sm btn-outline-danger">Delete</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(list)}" class="col-12 mt-4">
                    <p class="text-muted">No products found.</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
></script></body>
</html>
