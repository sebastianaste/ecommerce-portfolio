<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Valgames - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
</head>
<body>
<div class="">
    <div class="container">
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/img/logo.png}" style="height: 30px;"/>
                </a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav container align-items-center">
                        <li class="nav-item dropdown text-center">
                            <a class="nav-link dropdown-toggle" href="#" role="button"
                               data-bs-toggle="dropdown" aria-expanded="false">Products</a>
                            <ul class="dropdown-menu">
                                <li th:each="cat : ${categories}">
                                    <a class="dropdown-item"
                                       th:href="@{/catalog(categoryId=${cat.categoryId})}"
                                       th:text="${cat.categoryName}"></a>
                                </li>
                                <li><hr class="dropdown-divider"/></li>
                                <li><a class="dropdown-item" th:href="@{/catalog}">All Products</a></li>
                            </ul>
                        </li>
                        <li class="nav-item cart-class ms-sm-auto">
                            <a class="nav-link d-flex align-items-center bg-opacity-50 rounded-4 btn btn-outline-light"
                               th:href="@{/cart}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                                     fill="currentColor" class="bi bi-cart m-1" viewBox="0 0 16 16">
                                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                                </svg>
                                <div class="p-2">Cart</div>
                                <div class="m-1 p-1 bg-dark bg-opacity-75 rounded-2 px-2 text-white"
                                     th:text="${cartCount != null ? cartCount : 0}">0</div>
                            </a>
                        </li>
                        <li class="nav-item ms-2">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="nav-link d-flex align-items-center bg-opacity-50 rounded-4 btn btn-outline-light">
                                    <div class="p-2" sec:authentication="name">User</div>
                                    <div class="m-1 p-1 bg-dark bg-opacity-75 rounded-2 px-2 text-white">Logout</div>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container-flex mt-3">
            <h2 class="mb-3">Shopping Cart</h2>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div th:if="${#lists.isEmpty(items)}" class="alert alert-info">
                Your cart is empty. <a th:href="@{/catalog}">Continue shopping</a>
            </div>

            <div th:each="item : ${items}" class="card mb-3 cart-item">
                <div class="row g-0">
                    <div class="col-md-2 col-sm-3">
                        <img th:src="@{/img/{id}.png(id=${item.product.id})}"
                             class="img-fluid rounded-start img-cart" alt="Product"
                             onerror="this.src='/img/placeholder.png'"/>
                    </div>
                    <div class="col-md-6 col-sm-5">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${item.product.productName}"></h5>
                            <p class="card-text text-muted description" th:text="${item.product.productDescription}"></p>
                            <p class="text-success fw-bold" th:text="'$' + ${item.product.unitPrice}"></p>
                        </div>
                    </div>
                    <div class="col-md-4 col-sm-4">
                        <div class="card-body d-flex flex-column justify-content-center h-100">
                            <div class="mb-3 d-inline-flex align-content-center justify-content-center">
                                <form th:action="@{/cart/update}" method="post" class="d-inline-flex align-items-center">
                                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                                    <button type="submit" name="quantity" th:value="${item.quantity - 1}"
                                            class="btn btn-outline-secondary">−</button>
                                    <h4 class="m-1 mx-2" th:text="${item.quantity}">0</h4>
                                    <button type="submit" name="quantity" th:value="${item.quantity + 1}"
                                            class="btn btn-outline-secondary">+</button>
                                </form>
                                <form th:action="@{/cart/remove}" method="post" class="d-inline ms-2">
                                    <input type="hidden" name="productId" th:value="${item.product.id}"/>
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                             fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                        </svg>
                                    </button>
                                </form>
                            </div>
                            <div class="text-center">
                                <p class="mb-1 text-muted">Total:</p>
                                <h5 class="text-success mb-2" th:text="'$' + ${item.product.unitPrice * item.quantity}"></h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${!#lists.isEmpty(items)}" class="card mt-4 mb-5">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <h4>Cart Total: <span class="text-success" th:text="'$' + ${total}"></span></h4>
                        </div>
                        <div class="col-md-6 text-end">
                            <form th:action="@{/cart/clear}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-outline-secondary me-2">Clear Cart</button>
                            </form>
                            <button class="btn btn-dark px-5">Checkout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="border-top mt-5">
            <div class="container py-4">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <h6 class="text-uppercase fw-bold">Valgames</h6>
                    </div>
                    <div class="col-md-6 mb-3 text-end">
                        <h6 class="text-uppercase fw-bold">Contact</h6>
                        <p class="mb-1">Email: info@valgames.com</p>
                        <p class="mb-0">Phone: +56 9 12345678</p>
                    </div>
                </div>
                <hr/>
                <div class="text-center small">© 2026 Valgames</div>
            </div>
        </footer>
    </div>
</div>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
></script>
</body>
</html>
